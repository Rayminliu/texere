[project]
name = "texere"
version = "0.6.7"
description = "把 Markdown 渲染成排版合格的中文正式 docx / PDF（标书 / 申报书 / 结题报告）"
readme = "README.md"
license = "MIT"
# 下限 3.10 由可选依赖 PyMuPDF 决定（pymupdf 1.24+ 要求 >=3.10）；
# 核心链路（只出 docx）在 3.9 也能跑，实测环境为 Python 3.11 / Windows。
requires-python = ">=3.10"
dependencies = [
    # post.py 大量使用 python-docx 的 OOXML 底层 API（OxmlElement / qn / schema 顺序），
    # 故锁主版本：升到 2.x 前必须先跑 --sample 回归。
    "python-docx>=1.1,<2.0",
    # python-docx 的底层依赖，显式声明防止被其他包降级导致难懂的报错。
    "lxml>=5.2,<7",
]

# 可选依赖：按需安装，非 Windows / 无 Word 的机器不必装 pywin32。
#   uv sync --extra pdf      仅 Word 验收 + 导 PDF
#   uv sync --extra check    仅 PDF 目视验收
#   uv sync --all-extras     全装
#
# 注意：本仓库是脚本集合，没有构建后端，**`pip install .` 会失败**。
# 纯 pip 环境请用 `pip install -r requirements.txt`；本文件的 extras 是给 uv 用的。
[project.optional-dependencies]
pdf = ["pywin32>=312,<400"]
check = ["PyMuPDF>=1.28,<2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9.0", "pre-commit>=4"]

# 代码质量工具：Ruff（替代 Flake8+Black+isort）
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]  # PEP8, pyflakes, isort, pycodestyle
ignore = ["E501", "N803", "N806"]  # E501: 行长让 formatter 处理，N803/N806: OOXML 标准缩写

[tool.ruff.lint.isort]
known-first-party = ["texere"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# 注意：pandoc 与 Microsoft Word 是系统级依赖，pip/uv 都无法安装。
# 用 `python scripts/render.py --doctor` 检查。
