name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        # 不用 `pip install .`：本仓库是脚本集合（package = false），没有构建后端。
        # 直接装运行期依赖即可。
        run: |
          python -m pip install --upgrade pip
          pip install "python-docx>=1.1,<2.0" "lxml>=5.2,<7" "PyMuPDF>=1.24,<2" pytest

      - name: Assertions
        run: python -m pytest -q

      - name: Smoke (docx only)
        # Linux 上没有 Word，--pdf / --check 那条链只能在本机跑。
        run: |
          mkdir -p /tmp/docxkit_src
          cp sample.md /tmp/docxkit_src/01_sample.md
          python render.py --src /tmp/docxkit_src --out /tmp/smoke.docx --config sample_config.json
