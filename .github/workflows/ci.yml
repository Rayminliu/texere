name: CI

# 分层 CI 策略——为什么这样写才绿：
#
# 托管 runner 没有 Microsoft Word COM，也没有本机的版式基线，所以 CI 绝不碰：
#   1. PDF 导出与 --check：--sample 内部把渲染器硬编码成 word 且强制走 PDF，
#      在 runner 上必炸（render.py main() 里写死 "word"）——CI 冒烟改用
#      显式 --src 渲染纯 docx，不带 --pdf；
#   2. 版式快照比对：基线绑定录基那台机器的 Word 版本与字体，
#      换机必漂移（README「已知边界」）；
#   3. COM 并发 canary：由环境变量门控，CI 不设即默认 SKIP。
#
# 需要渲染器的用例靠代码里现成的 available() 守卫自动 SKIP；
# validate.py 退出码只数 FAIL/ERROR（sys.exit(0 if failed==0)），SKIP 放行——
# 因此"渲染类检查全部 SKIP"的证据冒烟退出码仍是 0。
# 全量 Word/WPS 验收仍在本机跑（README「开发」一节）；
# 第二层 render-libreoffice 用 LibreOffice 在 runner 上真渲染，见该 job 的注释。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 开发机是 GBK locale、runner 是 UTF-8：显式钉死 UTF-8 模式，
      # 同一份代码两边只许有一套解码行为
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # apt 自带的 pandoc 随镜像浮动（jammy 2.9 / noble 3.1.x），grid table 解析有差异；
      # 锁 3.11（与开发机同版）。资产 URL 是确定性的（pandoc-<ver>-1-amd64.deb 命名多年未变，
      # 已验证 200），直连下载——不经过 GitHub API（上次 API 解析瞬时失败导致 DEB_URL 为空）
      - name: 安装 pandoc 3.11（与开发环境同版）
        run: |
          curl -sfL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb" \
            -o /tmp/pandoc.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      # LibreOffice 契约用例（渲染器抽象/超时结构化）在 CI 真跑：available()
      # 守卫检出 soffice 即执行；Word/WPS 用例仍 SKIP（托管 runner 无 COM）
      - name: 安装 LibreOffice + 中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk
          soffice --version

      - name: 安装 Python 依赖（requirements.txt 含 pytest 与 ruff）
        run: pip install -r requirements.txt

      # doctor 只在核心依赖（pandoc/python-docx/lxml）缺失时退出 1；
      # Word 不可用只打印「仅 docx 渲染可用」并返回 0（doctor() 尾部 return 0）
      - name: 环境自检
        run: python scripts/render.py --doctor

      - name: Ruff（lint + 格式，规则以 pyproject [tool.ruff] 为准）
        run: |
          ruff check .
          ruff format --check .

      # pre-commit 同款快速子集：130 项、约 15 秒
      - name: 快速子集（不启渲染器）
        run: python -m pytest tests/test_version.py tests/test_docs_sync.py tests/test_validate_units.py tests/test_edit.py tests/test_snapshot.py -q

      # 全量套件：需要 Word/WPS/LibreOffice 的用例由 available() 守卫自动 SKIP，
      # 预期结果「全绿 + 若干 skipped」；有硬 FAIL 说明守卫漏了，那是真缺陷
      - name: 全量 pytest
        run: python -m pytest -q

      # 证据链冒烟：纯 docx 渲染（不带 --pdf，不碰渲染器）→ validate。
      # 渲染类检查降级为 SKIP，退出码仍为 0
      - name: 渲染 + 验收冒烟
        run: |
          python scripts/render.py --src assets/sample.md --out sample_ci.docx --config assets/sample_config.json
          python scripts/validate.py sample_ci.docx --out evidence_ci/

      - name: 上传证据包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence_ci/
          if-no-files-found: ignore
          retention-days: 7

  # ── 第二层：LibreOffice 真渲染验收（必需门禁，0.7.0 起转正）──────────
  # runner 装 LibreOffice + 中文字体后真出 PDF：页码 / 空白页 / 渲染器验收
  # 从第一层的 SKIP 变成真检查。visual_drift 仍 SKIP——版式基线绑定本机
  # Word 版本与字体（README「已知边界」），不硬凑。
  # 第一层也装了 soffice：LibreOffice 契约用例在 tier 1 真跑；
  # Word/WPS 用例仍 SKIP（托管 runner 无 COM），验收仍在本机。
  render-libreoffice:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 pandoc 3.11（与开发环境同版）
        run: |
          curl -sfL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb" \
            -o /tmp/pandoc.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: 安装 LibreOffice + 中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk
          soffice --version

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      # 渲染纯 docx（不带 --pdf）：validate.py 会用 --renderer libreoffice
      # 自己导出验收 PDF，一次导出够用，不做两次
      - name: 渲染样例 docx
        run: python scripts/render.py --src assets/sample.md --out sample_lo.docx --config assets/sample_config.json

      - name: LibreOffice 渲染验收
        run: python scripts/validate.py sample_lo.docx --renderer libreoffice --out evidence_lo/

      - name: 上传 LibreOffice 证据包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-libreoffice
          path: evidence_lo/
          if-no-files-found: ignore
          retention-days: 7
